project_id = "linkare-clinical"

# Gateway JWT verification is disabled per handler. Private handlers explicitly call
# auth.getUser(bearerToken) and verify active organization membership.
# Webhook = HMAC; Google callback = single-use state; calendar feed = bearer feed token;
# reminder-dispatch = dedicated cron secret. Retired endpoints only return HTTP 410.

[functions.calendar-feed]
verify_jwt = false

[functions.calendar-feed-token]
verify_jwt = false

